# MkDocs Configuration for 火宝短剧 Documentation
# Generated by chinese-doc-writer skill

site_name: 火宝短剧中文文档
site_url: https://chatfire-AI.github.io/huobao-drama
site_description: 火宝短剧AI短剧生成平台 - 完整中文文档体系

# Repository for GitHub Pages
repo_name: chatfire-AI/huobao-drama
repo_url: https://github.com/chatfire-AI/huobao-drama
edit_uri: blob/main/docs/

# Copyright
copyright: 'Copyright &copy; 2026 火宝短剧团队'

# Configuration
theme:
  name: material
  custom_dir: overrides
  palette:
    primary: indigo
    accent: blue
    scheme: default
  font:
    text: Roboto
    code: Roboto Mono
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - search.suggest
    - search.highlight
    - toc.follow
    - toc.integrate
  icon:
    repo: fontawesome/brands/github

# Markdown extensions
markdown_extensions:
  - abbr
  - attr_list
  - def_list
  - footnotes
  - meta
  - admonition
  - collapsible
  - table
  - toc:
      permalink: true
      separator: "-"
  - pymdownx.emoji
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - tables
  - md_in_html

# Plugins
plugins:
  - search:
      separator: '[\s\-\.]+'
      prebuild_index: true
  - roamlinks:
      url_template: "{root_path}/{slug}"
  - minify:
      minify_html: true
      minify_js: true
      minify_css: true
      htmlmin_opts:
        remove_comments: true
  - glightbox
  - social:
      cards: true
      cards_size: 1200x630

# Google Analytics (optional)
# analytics:
#   provider: google
#   property: G-XXXXXXXXXX

# External links
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/extra.js

# Social links
social:
  - icon: fontawesome/brands/github
    link: https://github.com/chatfire-AI/huobao-drama
  - icon: fontawesome/brands/discord
    link: https://discord.gg/huobao-drama

# Navigation structure
nav:
  - 文档首页: index.md
  - 快速入门:
      - quick-start/installation.md
      - quick-start/quick-start.md
      - quick-start/cheat-sheet.md
  - 用户指南:
      - quick-start/user-manual.md
      - quick-start/advanced-usage.md
      - quick-start/best-practices.md
      - quick-start/troubleshooting.md
      - quick-start/faq.md
      - quick-start/glossary.md
  - 开发手册:
      - developer-manual/environment.md
      - developer-manual/code-structure.md
      - developer-manual/development-guide.md
      - developer-manual/advanced-dev.md
      - developer-manual/api-reference.md
      - developer-manual/deployment.md
      - developer-manual/data-migration.md
      - developer-manual/docker-host-access.md
      - developer-manual/improvement-proposals.md
      - developer-manual/contributing.md
  - 专家指南:
      - expert-manual/fundamentals.md
      - expert-manual/architecture.md
      - expert-manual/architecture-analysis.md
      - expert-manual/storyboard-module-analysis.md
      - expert-manual/performance.md
      - expert-manual/design-patterns.md
      - expert-manual/security-guide.md

# Google Analytics (optional - uncomment and configure)
# google_analytics:
#   tracking_id: G-XXXXXXXXXX
#   anonymize_ip: true

# Show edit links
edit_uri_template: "https://github.com/chatfire-AI/huobao-drama/edit/main/docs/{path}"

# Deploy settings
extra:
  generator: false  # Remove "Created with MkDocs" footer

# Localized placeholder strings (for internationalization)
# language: zh
# direction: ltr
